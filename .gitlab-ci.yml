.worker-tests:
  rules:
    - changes:
        - gittools_worker/**/*
        - .gitlab-ci.yml
  script:
    - sh gittools_worker/ci/install-git.sh "$INSTALL_GIT_VERSION"
    - node --version
    - cd gittools_worker
    - npm test -- $TEST_ARGS

worker-tests-oldest:
  extends: .worker-tests
  image: node:16.17.0
  variables:
    INSTALL_GIT_VERSION: "2.45.0"

worker-tests-latest:
  extends: .worker-tests
  image: node:lts
  variables:
    INSTALL_GIT_VERSION: latest
    # Node 16.17 has no JUnit reporter, so only this job reports per-test results.
    TEST_ARGS: >-
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit.xml
  artifacts:
    when: always
    reports:
      junit: gittools_worker/junit.xml
